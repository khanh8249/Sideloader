name: CLI build - ARMv7

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build CLI for armv7-linux-gnueabihf
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update APT repositories
        run: |
          sudo apt-get update

      - name: Install ARMv7 cross compiler
        run: |
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf

      - name: Set up D compiler
        uses: ./.github/actions/setup-d-compiler
        with:
          target-triple: armv7-linux-gnueabihf

      - name: Configure ARMv7 linker
        run: |
          echo "CC=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
          echo "CXX=arm-linux-gnueabihf-g++" >> "$GITHUB_ENV"
          echo "AR=arm-linux-gnueabihf-ar" >> "$GITHUB_ENV"
          echo "AS=arm-linux-gnueabihf-as" >> "$GITHUB_ENV"
          echo "LD=arm-linux-gnueabihf-ld" >> "$GITHUB_ENV"
          echo "STRIP=arm-linux-gnueabihf-strip" >> "$GITHUB_ENV"

      - name: Check toolchain
        run: |
          echo "===== GCC ====="
          arm-linux-gnueabihf-gcc --version

          echo
          echo "===== LDC ====="
          ldc2 --version

          echo
          echo "===== TARGET ====="
          ldc2 -v 2>&1 | head -40 || true

      - name: Write version file
        uses: ./.github/actions/write-version-file

      - name: Build CLI
        run: |
          dub build \
            -b release-debug \
            --compiler=ldc2 \
            --arch armv7-linux-gnueabihf \
            :cli-frontend

      - name: Inspect generated binary
        run: |
          echo "===== BINARIES ====="
          find bin -maxdepth 2 -type f -print

          echo
          echo "===== FILE ====="
          file bin/* || true

          echo
          echo "===== ELF HEADER ====="
          for f in bin/*; do
            if file "$f" | grep -q ELF; then
              arm-linux-gnueabihf-readelf -h "$f" || true
            fi
          done

      - name: Rename files
        uses: ./.github/actions/rename-files
        with:
          build-tag: cli-armv7-linux-gnueabihf

      - name: Upload ARMv7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: sideloader-cli-armv7-linux-gnueabihf
          path: |
            ${{ github.workspace }}/bin/*
