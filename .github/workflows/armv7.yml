name: Build Sideloader ARMv7 Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y wget unzip curl xz-utils python3

      - name: Download Android NDK r27
        run: |
          cd $HOME
          wget -q https://dl.google.com/android/repository/android-ndk-r27-linux.zip
          unzip -q android-ndk-r27-linux.zip
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r27" >> $GITHUB_ENV
          echo "$HOME/android-ndk-r27/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Download LDC 1.43.0
        run: |
          cd $HOME
          wget -q https://github.com/ldc-developers/ldc/releases/download/v1.43.0/ldc2-1.43.0-linux-x86_64.tar.xz
          tar -xf ldc2-1.43.0-linux-x86_64.tar.xz
          echo "$HOME/ldc2-1.43.0-linux-x86_64/bin" >> $GITHUB_PATH

      - name: Download LDC Android ARMv7 addon
        run: |
          cd $HOME
          wget -q https://github.com/ldc-developers/ldc/releases/download/v1.43.0/ldc2-1.43.0-addon-android.tar.xz
          tar -xf ldc2-1.43.0-addon-android.tar.xz -C $HOME/ldc2-1.43.0-linux-x86_64/

      - name: Setup ldc2.conf for Android ARMv7
        run: |
          cat > $HOME/ldc2-1.43.0-linux-x86_64/etc/ldc2.conf/60-target-android-armv7a.conf << 'EOF'
          "armv7a-.*-linux-android":
          {
              switches = [
                  "-defaultlib=phobos2-ldc,druntime-ldc",
                  "-link-defaultlib-shared=false",
                  "-mtriple=armv7a-unknown-linux-android28",
                  "-gcc=/home/runner/android-ndk-r27/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi28-clang",
                  "-L--sysroot=/home/runner/android-ndk-r27/sysroot",
                  "-L-L/home/runner/android-ndk-r27/sysroot/usr/lib/arm-linux-androideabi/28"
              ],
              lib-dirs = [
                  "%%ldcbinarypath%%/../lib-android-armv7a"
              ],
              rpath = "";
          }
          EOF

      # ========== TẢI DEPS TRƯỚC KHI PATCH ==========
      - name: Fetch all dependencies
        continue-on-error: true
        run: |
          # Force fetch deps (không build thành công, nhưng tải deps về)
          dub build \
              --compiler=ldc2 \
              -a armv7a-unknown-linux-android28 \
              --build=release \
              frontends/cli 2>&1 | tail -20 || true
          
          echo "=== Check deps downloaded ==="
          ls ~/.dub/packages/ | head -20

      # ========== PATCH ARGPARSE ==========
      - name: Patch argparse
        run: |
          python3 << 'PYEOF'
          import os
          import glob

          # Tìm argparse ở mọi version
          candidates = glob.glob(os.path.expanduser('~/.dub/packages/argparse/*/argparse'))
          if not candidates:
              print("ERROR: argparse not found!")
              exit(1)

          base = candidates[0]
          print("Patching: " + base)

          parser_path = os.path.join(base, 'source/argparse/internal/parser.d')
          help_path = os.path.join(base, 'source/argparse/internal/help.d')

          if os.path.exists(parser_path):
              s = open(parser_path).read()
              s = s.replace('values = args[0..minValuesCount];',
                            'values = args[0..cast(uint) minValuesCount];')
              s = s.replace('args = args[minValuesCount..$];',
                            'args = args[cast(uint) minValuesCount..$];')
              open(parser_path, 'w').write(s)
              print("Patched parser.d")
          else:
              print("parser.d NOT FOUND at " + parser_path)
              exit(1)

          if os.path.exists(help_path):
              s = open(help_path).read()
              s = s.replace("return ' '.repeat(num).array;",
                            "return ' '.repeat(cast(size_t) num).array;")
              open(help_path, 'w').write(s)
              print("Patched help.d")
          else:
              print("help.d NOT FOUND at " + help_path)
              exit(1)

          print("argparse patch DONE")
          PYEOF

      # ========== PATCH BOTAN ==========
      - name: Patch Botan
        run: |
          python3 << 'PYEOF'
          import os, re, glob

          candidates = glob.glob(os.path.expanduser('~/.dub/packages/botan/*/botan'))
          if not candidates:
              print("botan not found, skip")
              exit(0)

          base = candidates[0]
          print("Patching: " + base)

          count = 0
          for root, dirs, files in os.walk(base):
              for f in files:
                  if not f.endswith('.d'):
                      continue
                  path = os.path.join(root, f)
                  try:
                      s = open(path).read()
                  except:
                      continue
                  orig = s
                  s = re.sub(
                      r'\bdelete\s+([A-Za-z_][A-Za-z0-9_.]*(?:\([^;)]*\))?)\s*;',
                      r'\1.destroy();', s
                  )
                  s = re.sub(r'^(\s+)this\(ALLOC\)', r'\1public this(ALLOC)', s, flags=re.MULTILINE)
                  s = re.sub(r'^(\s+)this\(DataSource', r'\1public this(DataSource', s, flags=re.MULTILINE)
                  s = re.sub(r'^(\s+)this\(in string', r'\1public this(in string', s, flags=re.MULTILINE)
                  if s != orig:
                      open(path, 'w').write(s)
                      print(path + ": patched")
                      count += 1
          print("Botan: " + str(count) + " files patched")
          PYEOF

      # ========== VERIFY PATCH ==========
      - name: Verify patches
        run: |
          echo "=== argparse parser.d ==="
          find ~/.dub/packages/argparse -name parser.d -exec grep -l "cast(uint) minValuesCount" {} \;
          echo "=== argparse help.d ==="
          find ~/.dub/packages/argparse -name help.d -exec grep -l "cast(size_t) num" {} \;

      # ========== BUILD CHÍNH ==========
      - name: Build
        env:
          ANISETTE_URL: "https://anisette-v3-server-sg29.onrender.com/"
        run: |
          ldc2 --version
          dub build \
              --compiler=ldc2 \
              -a armv7a-unknown-linux-android28 \
              --build=release \
              frontends/cli

      - name: Verify binary
        if: success()
        run: |
          file frontends/cli/sideloader
          readelf -a frontends/cli/sideloader | grep -i tls || true

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sideloader-armv7-android9
          path: frontends/cli/sideloader
          retention-days: 30
