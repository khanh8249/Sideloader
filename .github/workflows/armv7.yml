name: Build Sideloader - Android ARMv7

on:
  workflow_dispatch:
  push:
    branches:
      - armv7
      - new
      - main

permissions:
  contents: read

env:
  NDK_VERSION: r27d
  ANDROID_API: "24"
  MAX_RETRIES: "25"

jobs:
  build:
    name: ARMv7 Android / Termux
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ============================================================
      # HOST PACKAGES
      # ============================================================
      - name: Install host dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            cmake \
            ninja-build \
            pkg-config \
            git \
            curl \
            wget \
            unzip \
            xz-utils \
            python3 \
            python3-pip \
            file \
            binutils \
            jq

      # ============================================================
      # ANDROID NDK
      # ============================================================
      - name: Install Android NDK
        shell: bash
        run: |
          set -eux

          NDK_VERSION="${NDK_VERSION}"

          mkdir -p "$HOME/android-sdk"

          cd "$HOME/android-sdk"

          wget -q \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" \
            -O ndk.zip

          unzip -q ndk.zip

          mv "android-ndk-${NDK_VERSION}" ndk

          echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

          rm -f ndk.zip

          echo "NDK:"
          "$HOME/android-sdk/ndk/ndk-build" --version

      # ============================================================
      # ANDROID ARMV7 TOOLCHAIN
      # ============================================================
      - name: Configure Android ARMv7 toolchain
        shell: bash
        run: |
          set -eux

          NDK="$ANDROID_NDK_HOME"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          TARGET="armv7a-linux-androideabi${ANDROID_API}"

          echo "ANDROID_TARGET=$TARGET" >> "$GITHUB_ENV"

          echo "CC=$LLVM/${TARGET}-clang" >> "$GITHUB_ENV"
          echo "CXX=$LLVM/${TARGET}-clang++" >> "$GITHUB_ENV"

          echo "AR=$LLVM/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$LLVM/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$LLVM/llvm-strip" >> "$GITHUB_ENV"

          echo "ANDROID_CC=$LLVM/${TARGET}-clang" >> "$GITHUB_ENV"
          echo "ANDROID_CXX=$LLVM/${TARGET}-clang++" >> "$GITHUB_ENV"

          echo "TARGET=$TARGET"

          "$LLVM/${TARGET}-clang" \
            --version

      # ============================================================
      # INSTALL LDC
      # ============================================================
      - name: Install LDC
        shell: bash
        run: |
          set -eux

          LDC_VERSION="1.41.0"

          mkdir -p "$HOME/ldc"

          wget -q \
            "https://github.com/ldc-developers/ldc/releases/download/v${LDC_VERSION}/ldc2-${LDC_VERSION}-linux-x86_64.tar.xz" \
            -O /tmp/ldc.tar.xz

          tar -xf /tmp/ldc.tar.xz \
            --strip-components=1 \
            -C "$HOME/ldc"

          echo "$HOME/ldc/bin" >> "$GITHUB_PATH"

          "$HOME/ldc/bin/ldc2" --version
          "$HOME/ldc/bin/dub" --version

      # ============================================================
      # CREATE ANDROID LDC WRAPPER
      #
      # Dub invokes this wrapper instead of raw ldc2.
      # The wrapper forces the Android ARMv7 target and linker.
      # ============================================================
      - name: Create Android ARMv7 LDC wrapper
        shell: bash
        run: |
          set -eux

          mkdir -p "$HOME/bin"

          cat > "$HOME/bin/ldc2-android-armv7" <<'EOF'
          #!/usr/bin/env bash

          set -e

          REAL_LDC="$HOME/ldc/bin/ldc2"

          NDK="${ANDROID_NDK_HOME}"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          TARGET="armv7a-linux-androideabi24"

          exec "$REAL_LDC" \
            -mtriple="$TARGET" \
            -mcpu=cortex-a7 \
            -mattr=+v7 \
            "$@" \
            -L=-fuse-ld=lld \
            -L=-target="$TARGET" \
            -L=-Wl,--gc-sections
          EOF

          chmod +x "$HOME/bin/ldc2-android-armv7"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/ldc2-android-armv7" --version

      # ============================================================
      # PROJECT INSPECTION
      # ============================================================
      - name: Inspect project
        shell: bash
        run: |
          set +e

          echo "================================"
          echo "PROJECT"
          echo "================================"

          pwd

          echo
          echo "DUB FILES:"
          find . \
            -type f \
            \( \
              -name 'dub.json' \
              -o -name 'dub.sdl' \
            \) \
            -not -path './.git/*' \
            -print

          echo
          echo "FRONTENDS:"
          find frontends \
            -maxdepth 3 \
            -type f \
            -print 2>/dev/null || true

          echo
          echo "GUI REFERENCES:"
          grep -RniE \
            'gtk-d|gtk|glib|gdk|x11|qt|libadwaita' \
            --include='dub.json' \
            --include='dub.sdl' \
            --include='*.d' \
            . 2>/dev/null | head -300 || true

      # ============================================================
      # DUB CACHE
      # ============================================================
      - name: Prepare Dub cache
        shell: bash
        run: |
          set -eux

          mkdir -p "$HOME/.dub/packages"

          dub --version

          echo
          echo "DUB CACHE:"
          ls -la "$HOME/.dub" || true

      # ============================================================
      # FETCH
      # ============================================================
      - name: Fetch dependencies
        shell: bash
        run: |
          set +e

          dub fetch --vverbose

          exit 0

      # ============================================================
      # ADAPTIVE BUILD
      #
      # The Python patcher is allowed to modify dependency source
      # inside the Dub cache.
      #
      # BUILD FAILURE DOES NOT IMMEDIATELY FAIL THE JOB.
      # ============================================================
      - name: Adaptive ARMv7 build
        shell: bash
        env:
          DFLAGS: >
            -mtriple=armv7a-linux-androideabi24
            -mcpu=cortex-a7
            -mattr=+v7
        run: |
          set -u

          mkdir -p build-logs
          mkdir -p .armv7-patches

          RETRIES=0

          while true; do
            RETRIES=$((RETRIES + 1))

            echo
            echo "================================================"
            echo " ARMv7 BUILD ATTEMPT ${RETRIES}/${MAX_RETRIES}"
            echo "================================================"

            LOG="build-logs/build-${RETRIES}.log"

            rm -rf build-armv7

            set +e

            dub build \
              :cli-frontend \
              --compiler="$HOME/bin/ldc2-android-armv7" \
              --build=release \
              --vverbose \
              >"$LOG" 2>&1

            STATUS=$?

            set -e

            if [ "$STATUS" -eq 0 ]; then
              echo
              echo "==============================================="
              echo " BUILD SUCCESS"
              echo "==============================================="

              cp "$LOG" build-logs/final-build.log

              break
            fi

            echo
            echo "==============================================="
            echo " BUILD FAILED"
            echo "==============================================="
            echo "Exit code: $STATUS"
            echo
            tail -n 120 "$LOG"

            if [ "$RETRIES" -ge "$MAX_RETRIES" ]; then
              echo
              echo "Maximum retry count reached."
              exit 1
            fi

            echo
            echo "Running ARMv7 patcher..."

            set +e

            python3 tools/armv7-patcher.py \
              "$LOG" \
              --root "$PWD" \
              --cache "$HOME/.dub/packages" \
              --state ".armv7-patches"

            PATCH_STATUS=$?

            set -e

            case "$PATCH_STATUS" in

              0)
                echo
                echo "[ARMV7] Patch applied."
                echo "[ARMV7] Retrying build..."
                ;;

              10)
                echo
                echo "[ARMV7] Error detected but no safe automatic"
                echo "         patch rule matched."
                echo
                echo "The build cannot be automatically repaired."
                echo "Uploading logs and failing."
                exit 1
                ;;

              20)
                echo
                echo "[ARMV7] Patch already applied."
                echo "[ARMV7] Same error appeared again."
                echo "         Refusing infinite patch loop."
                exit 1
                ;;

              *)
                echo
                echo "[ARMV7] Patcher internal failure."
                exit 1
                ;;
            esac
          done

      # ============================================================
      # LOCATE BINARY
      # ============================================================
      - name: Locate binary
        shell: bash
        run: |
          set -eux

          mkdir -p release

          echo "Executable files:"

          find . \
            -type f \
            -perm -111 \
            -not -path './.git/*' \
            -not -path './build-logs/*' \
            -print

          echo
          echo "ELF files:"

          find . \
            -type f \
            -exec file {} \; \
            | grep -E 'ELF|ARM' \
            || true

      # ============================================================
      # FIND ARM BINARY
      # ============================================================
      - name: Extract ARMv7 executable
        shell: bash
        run: |
          set -eux

          BIN=""

          while IFS= read -r f; do
            INFO="$(file "$f" || true)"

            if echo "$INFO" | grep -q 'ELF'; then
              if echo "$INFO" | grep -q 'ARM'; then
                BIN="$f"
                break
              fi
            fi
          done < <(
            find . \
              -type f \
              -perm -111 \
              -not -path './.git/*'
          )

          if [ -z "$BIN" ]; then
            echo "No ARM ELF executable found."
            exit 1
          fi

          echo "Found:"
          echo "$BIN"

          cp "$BIN" release/sideloader-armv7

      # ============================================================
      # VERIFY ELF
      # ============================================================
      - name: Verify ARMv7 Android ELF
        shell: bash
        run: |
          set -eux

          BIN="release/sideloader-armv7"

          file "$BIN"

          echo
          echo "===== ELF HEADER ====="

          readelf -h "$BIN"

          echo
          echo "===== ELF MACHINE ====="

          readelf -h "$BIN" | grep -E \
            'Class:|Machine:|OS/ABI:|Type:'

          echo
          echo "===== ARM ATTRIBUTES ====="

          readelf -A "$BIN" || true

          echo
          echo "===== NEEDED LIBRARIES ====="

          readelf -d "$BIN" \
            | grep NEEDED \
            || true

          echo
          echo "===== CHECK ====="

          if ! file "$BIN" | grep -q 'ARM'; then
            echo "ERROR: output is not ARM."
            exit 1
          fi

      # ============================================================
      # STRIP
      # ============================================================
      - name: Strip binary
        shell: bash
        run: |
          set -eux

          "$STRIP" \
            --strip-unneeded \
            release/sideloader-armv7

          file release/sideloader-armv7

          ls -lh release/sideloader-armv7

      # ============================================================
      # PACKAGE
      # ============================================================
      - name: Package
        shell: bash
        run: |
          set -eux

          cp build-logs/final-build.log \
            release/build.log

          cp -r .armv7-patches \
            release/patch-history

          tar \
            -C release \
            -czf sideloader-termux-armv7.tar.gz \
            sideloader-armv7 \
            build.log \
            patch-history

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload ARMv7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: sideloader-termux-armv7
          path: |
            release/sideloader-armv7
            release/build.log
            release/patch-history
            sideloader-termux-armv7.tar.gz

      # ============================================================
      # UPLOAD FAILURE LOGS
      # ============================================================
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: armv7-build-diagnostics
          path: |
            build-logs/
            .armv7-patches/
