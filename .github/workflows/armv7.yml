name: CLI build - ARMv7

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build CLI for armv7-linux-gnueabihf
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update APT repos
        run: sudo apt-get update

      - name: Install ARMv7 toolchain
        run: |
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf

      - name: Set-up D compiler
        uses: ./.github/actions/setup-d-compiler
        with:
          target-triple: armv7-linux-gnueabihf

      - name: Write version file
        uses: ./.github/actions/write-version-file
        
      - name: Patch argparse for LDC 1.34
        shell: bash
        run: |
          ARGPARSE="$HOME/.dub/packages/argparse/1.3.0/argparse/source/argparse/internal/parser.d"

          if [ ! -f "$ARGPARSE" ]; then
            echo "argparse parser.d not found:"
            find "$HOME/.dub/packages" -path '*argparse*parser.d' -print
            exit 1
          fi

          echo "Using:"
          echo "$ARGPARSE"

          sed -n '1,45p' "$ARGPARSE"

          python3 - "$ARGPARSE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          # LDC 1.34/std.range returns size_t/ulong on this target.
          # argparse 1.3.0 stores the result in uint.
          text = re.sub(
              r'\bminValuesCount\s*=\s*([^\n;]+)',
              r'minValuesCount = cast(uint)(\1)',
              text,
              count=2
          )

          path.write_text(text)
          PY

          echo
          echo "After patch:"
          sed -n '1,45p' "$ARGPARSE"

      - name: Configure ARMv7 environment
        run: |
          cat >> "$GITHUB_ENV" <<'EOF'
          CC=arm-linux-gnueabihf-gcc
          CXX=arm-linux-gnueabihf-g++
          AR=arm-linux-gnueabihf-ar
          AS=arm-linux-gnueabihf-as
          STRIP=arm-linux-gnueabihf-strip
          EOF

      - name: Check toolchain
        run: |
          echo "=== GCC ==="
          arm-linux-gnueabihf-gcc --version

          echo
          echo "=== LDC ==="
          ldc2 --version

          echo
          echo "=== DUB ==="
          dub --version

      - name: Build CLI
        run: |
          dub build \
            -b release-debug \
            --compiler=ldc2 \
            --arch armv7-linux-gnueabihf \
            :cli-frontend

      - name: Inspect generated binary
        run: |
          echo "=== FILE ==="
          file bin/*

          echo
          echo "=== ELF HEADER ==="

          for f in bin/*; do
            if file "$f" | grep -q ELF; then
              arm-linux-gnueabihf-readelf -h "$f"
              echo
            fi
          done

      - name: Move files around for artifact
        uses: ./.github/actions/rename-files
        with:
          build-tag: cli-armv7-linux-gnueabihf

      - name: Upload ARMv7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: sideloader-cli-armv7-linux-gnueabihf
          path: |
            ${{ github.workspace }}/bin/*
