name: Build Linux ARMv7

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-armv7:
    runs-on: ubuntu-24.04-arm
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc ldc dub git \
            libimobiledevice-dev libplist-dev \
            libssl-dev libcurl4-openssl-dev pkg-config

      - name: Build
        run: |
          dub build --compiler=ldc2 --build=release

      - name: Quét sạch tìm binary
        run: |
          echo "=== Tất cả file executable ==="
          find . -type f -executable 2>/dev/null | grep -v ".git/" | grep -v ".dub/obj" | sort
          
          echo ""
          echo "=== ELF binary (Linux executable) ==="
          find . -type f -executable -exec sh -c 'file "$1" | grep -q ELF && echo "$1"' _ {} \; 2>/dev/null | grep -v ".git/" | sort
          
          echo ""
          echo "=== File trong bin/ ==="
          ls -laR bin/ 2>/dev/null || echo "Không có bin/"
          
          echo ""
          echo "=== File trong .dub/ ==="
          find .dub/ -type f 2>/dev/null | sort || echo "Không có .dub/"
          
          echo ""
          echo "=== Tìm theo tên sideloader ==="
          find . -iname "*sideloader*" -type f 2>/dev/null | grep -v ".git/"

      - name: Package
        run: |
          mkdir -p dist
          
          # Quét sạch ELF binary, lấy cái to nhất (thường là main binary)
          BIN=$(find . -type f -executable -exec sh -c 'file "$1" | grep -q "ELF.*executable" && echo "$1"' _ {} \; 2>/dev/null | grep -v ".git/" | grep -v ".dub/obj" | xargs -I{} ls -la {} 2>/dev/null | sort -k5 -n -r | head -1 | awk '{print $NF}')
          
          if [ -z "$BIN" ]; then
            # Fallback: bất kỳ file executable nào
            BIN=$(find . -type f -executable 2>/dev/null | grep -v ".git/" | grep -v ".dub/obj" | head -1)
          fi
          
          if [ -n "$BIN" ] && [ -f "$BIN" ]; then
            echo "Found binary: $BIN"
            file "$BIN"
            cp "$BIN" dist/sideloader-linux-armv7
            chmod +x dist/sideloader-linux-armv7
          else
            echo "Binary not found!"
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sideloader-linux-armv7
          path: dist/sideloader-linux-armv7
