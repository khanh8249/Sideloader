name: Build Linux ARMv7

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-armv7:
    runs-on: ubuntu-24.04-arm  # Native ARM runner, khỏi QEMU
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc ldc dub git \
            libimobiledevice-dev libplist-dev \
            libssl-dev libcurl4-openssl-dev pkg-config

      - name: Build
        run: |
          dub build --compiler=ldc2 --build=release
          mkdir -p dist
          cp bin/sideloader dist/sideloader-linux-armv7
          chmod +x dist/sideloader-linux-armv7

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sideloader-linux-armv7
          path: dist/sideloader-linux-armv7
