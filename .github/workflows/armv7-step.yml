name: Cross-Compile Linux ARMv7

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  cross-compile:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ldc dub git gcc-arm-linux-gnueabihf \
            libimobiledevice-dev libplist-dev libssl-dev pkg-config

      - name: Download LDC ARM runtime
        run: |
          wget -q https://github.com/ldc-developers/ldc/releases/download/v1.39.0/ldc2-1.39.0-linux-armhf.tar.xz
          tar xf ldc2-1.39.0-linux-armhf.tar.xz

      - name: Cross-compile
        run: |
          export LDC_ARM=./ldc2-1.39.0-linux-armhf
          dub build --compiler=ldc2 --build=release \
            --arch=armv7l-linux-gnueabihf \
            --override-config=default \
            -- \
            -mtriple=armv7l-linux-gnueabihf \
            -L-L$LDC_ARM/lib \
            -L-ldruntime-ldc-shared \
            -L-lphobos2-ldc-shared

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sideloader-armv7-cross
          path: bin/sideloader
