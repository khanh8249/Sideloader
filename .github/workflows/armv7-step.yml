name: Build Linux ARMv7

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-armv7:
    runs-on: ubuntu-24.04-arm
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc ldc dub git \
            libimobiledevice-dev libplist-dev \
            libssl-dev libcurl4-openssl-dev pkg-config

      - name: Build
        run: |
          # Build executable thay vì library
          dub build :sideloader --compiler=ldc2 --build=release || \
          dub build --compiler=ldc2 --build=release --config=application || \
          dub build --compiler=ldc2 --build=release
          
          # Tìm file output
          find . -name "sideloader" -type f
          ls -la bin/ 2>/dev/null || true

      - name: Package
        run: |
          mkdir -p dist
          # Tìm và copy file
          BIN=$(find . -name "sideloader" -type f | head -1)
          if [ -n "$BIN" ]; then
            cp "$BIN" dist/sideloader-linux-armv7
            chmod +x dist/sideloader-linux-armv7
          else
            echo "Binary not found!"
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sideloader-linux-armv7
          path: dist/sideloader-linux-armv7
